name: CI

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify API_SECRET secret
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          if [ -z "$API_SECRET" ]; then
            echo "Error: API_SECRET secret is required but not set."
            exit 1
          fi

      - name: Run tests
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
        run: npm test
